<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="毛孩相機">
<title>毛孩相機</title>
<style>
:root{
  /* 設計：畫面只屬於牠。純黑底、白字、一個暖色只在「現在可以拍」時出現；快門自己會告訴你時機。 */
  --bg:#000; --ink:#fff; --ink2:rgba(255,255,255,.62); --ink3:rgba(255,255,255,.34);
  --hair:rgba(255,255,255,.1); --fill:rgba(255,255,255,.1); --mat:rgba(28,28,30,.74);
  --accent:#ffc978; --bad:#ff8a7a;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);overscroll-behavior:none}
body{font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select{font:inherit;color:var(--ink);background:var(--fill);border:0;border-radius:12px;padding:12px 14px;width:100%}
svg{display:block}
[hidden]{display:none!important}
.screen{position:fixed;inset:0;display:none;flex-direction:column;background:var(--bg);
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.screen.on{display:flex;animation:in .32s var(--ease)}
@keyframes in{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}
.bar{display:flex;align-items:center;gap:6px;padding:8px 12px;min-height:56px;flex:none}
.bar h1{font-size:17px;margin:0 0 0 6px;font-weight:600;flex:1;letter-spacing:.01em}
.sp{flex:1}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--fill);transition:transform .2s var(--ease),background .2s}
.ib:active{transform:scale(.9)}
.ib svg{width:20px;height:20px}
.ib.act{background:var(--ink);color:#000}
.tx{height:40px;padding:0 12px;font-size:15px;color:var(--ink2);font-weight:500}
.tx.act{color:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:17px;white-space:nowrap;font-size:14px;color:var(--ink2);transition:background .2s,color .2s}
.chip.act{background:var(--fill);color:var(--ink);font-weight:600}
.chip svg{width:14px;height:14px}
.btn{height:52px;padding:0 24px;border-radius:26px;background:var(--fill);font-weight:600;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .2s var(--ease),opacity .2s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--ink);color:#000}
.btn.wide{flex:1}
.btn:disabled{opacity:.5}
.row{display:flex;gap:10px;align-items:center}
.scrollx{display:flex;gap:2px;overflow-x:auto;padding:0 10px;scrollbar-width:none;flex:none}
.scrollx::-webkit-scrollbar{display:none}
.muted{color:var(--ink2)} .small{font-size:13px}

/* ---------- 相機 ---------- */
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:6px 12px;min-height:52px;flex:none}
.top .tbtn{display:inline-flex;align-items:center;gap:4px;height:40px;padding:0 6px;font-size:15px;font-weight:500;color:var(--ink2);justify-self:start;max-width:36vw}
.top .tbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .tbtn svg{width:12px;height:12px;opacity:.6;flex:none}
.top #sceneBtn{justify-self:center;color:var(--ink);font-weight:600;font-size:16px}
.top .tr{justify-self:end;display:flex;gap:8px}
#stageWrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;container-type:size}
#stage{position:relative;width:100%;height:100%;border-radius:28px;overflow:hidden;background:#0b0b0c;transition:transform .12s ease-out,opacity .12s}
@supports (width:1cqw){#stage{width:min(100cqw,75cqh);height:min(100cqh,133.34cqw)}}
#stage.blink{transform:scale(.985);opacity:.25}
#stage::before{content:"";position:absolute;inset:0 0 auto 0;height:90px;background:linear-gradient(rgba(0,0,0,.38),transparent);z-index:1;pointer-events:none}
#video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform-origin:center}
#ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#msg{position:absolute;z-index:2;top:16px;left:20px;right:20px;text-align:center;font-size:16px;font-weight:600;letter-spacing:.02em;
  text-shadow:0 1px 10px rgba(0,0,0,.55);pointer-events:none;transition:opacity .14s,color .3s;text-wrap:balance}
#msg.sw{opacity:0}
#msg.ok{color:var(--accent)}
#zooms{position:absolute;z-index:2;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:2px;padding:3px;border-radius:22px;
  background:rgba(0,0,0,.32);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4)}
#zooms button{width:36px;height:36px;border-radius:50%;font-size:12px;font-weight:600;color:var(--ink2);font-variant-numeric:tabular-nums;transition:all .25s var(--ease)}
#zooms button.act{background:rgba(255,255,255,.16);color:var(--accent);font-size:13px}
#burstCount{position:absolute;z-index:2;top:50%;left:50%;transform:translate(-50%,-50%);font-size:96px;font-weight:200;opacity:0;text-shadow:0 2px 24px rgba(0,0,0,.5);font-variant-numeric:tabular-nums;transition:opacity .2s}
#work{position:absolute;inset:0;z-index:3;display:none;flex-direction:column;gap:16px;align-items:center;justify-content:center;
  background:rgba(0,0,0,.4);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);font-weight:500;color:var(--ink2)}
#work.on{display:flex}
#work::before{content:"";width:26px;height:26px;border-radius:50%;border:2px solid var(--hair);border-top-color:var(--ink);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#comps{gap:4px;padding:12px 14px 0;flex:none}
#comps button{flex:none;display:flex;flex-direction:column;align-items:center;gap:5px;width:54px;font-size:11px;color:var(--ink3);letter-spacing:.04em;transition:color .25s}
#comps svg{width:36px;height:48px;border-radius:8px;background:rgba(255,255,255,.07);transition:all .3s var(--ease)}
#comps button.act{color:var(--ink)}
#comps button.act svg{background:rgba(255,255,255,.14);box-shadow:0 0 0 1.5px var(--accent)}
#modes{display:flex;justify-content:center;gap:34px;padding:8px 0 2px;flex:none}
#modes button{position:relative;height:36px;font-size:15px;letter-spacing:.12em;color:var(--ink3);font-weight:500;transition:color .25s}
#modes button.act{color:var(--ink);font-weight:600}
#modes button::after{content:"";position:absolute;left:50%;bottom:0;width:4px;height:4px;margin-left:-3px;border-radius:50%;background:var(--accent);opacity:0;transform:scale(0);transition:all .3s var(--ease)}
#modes button.act::after{opacity:1;transform:none}
#shootRow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:6px 30px 14px;flex:none}
.sideBtn{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;color:var(--ink3);letter-spacing:.06em;width:56px}
.sideBtn .th{width:48px;height:48px;border-radius:50%;overflow:hidden;background:var(--fill);display:grid;place-items:center;color:var(--ink);transition:transform .2s var(--ease)}
.sideBtn:active .th{transform:scale(.9)}
.sideBtn .th img{width:100%;height:100%;object-fit:cover}
.sideBtn .th svg{width:22px;height:22px}
.sideBtn .th.pop{animation:pop .45s var(--ease)}
@keyframes pop{0%{transform:scale(.5);opacity:.4}100%{transform:none;opacity:1}}
#albumBtn{justify-self:start} #callBtn{justify-self:end}
#callBtn.ring .th{animation:ring .5s var(--ease)}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(255,201,120,.5)}100%{box-shadow:0 0 0 18px rgba(255,201,120,0)}}
#shutter{width:78px;height:78px;border-radius:50%;border:3px solid var(--ink);display:grid;place-items:center;transition:border-color .35s,box-shadow .35s}
#shutter b{width:64px;height:64px;border-radius:50%;background:var(--ink);display:block;transition:transform .18s var(--ease)}
#shutter:active b{transform:scale(.86)}
#shutter.ready{border-color:var(--accent);animation:breathe 1.8s ease-in-out infinite}
@keyframes breathe{0%,100%{box-shadow:0 0 0 0 rgba(255,201,120,0)}50%{box-shadow:0 0 0 7px rgba(255,201,120,.22)}}

/* 開場 */
#startCard{position:absolute;inset:0;z-index:5;background:#000;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 24px) 32px calc(env(safe-area-inset-bottom) + 28px)}
#startCard .hero{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px}
#startCard .mark{width:54px;height:54px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;margin-bottom:18px}
#startCard .mark::after{content:"";width:40px;height:40px;border-radius:50%;background:var(--accent)}
#startCard h2{margin:0;font-size:40px;font-weight:700;letter-spacing:.02em;line-height:1.15}
#startCard .hero p{margin:0;font-size:19px;color:var(--ink2);line-height:1.6;font-weight:400}
#startCard .cta{display:flex;flex-direction:column;gap:6px;align-items:stretch}
#startCard .link{height:48px;color:var(--ink2);font-size:15px}
#startCard .fine{margin:6px 0 0;text-align:center;font-size:12px;color:var(--ink3);letter-spacing:.04em}
#startCard .err{margin:0 0 10px;color:var(--bad);font-size:14px}

/* ---------- 面板 ---------- */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;z-index:20;transition:opacity .3s}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--mat);backdrop-filter:blur(36px) saturate(1.6);-webkit-backdrop-filter:blur(36px) saturate(1.6);
  border-radius:28px 28px 0 0;max-height:88%;overflow-y:auto;transform:translateY(105%);transition:transform .42s var(--ease);
  padding:8px 20px calc(22px + env(safe-area-inset-bottom))}
#sheet.on{transform:none}
#sheet .grab{width:36px;height:5px;border-radius:3px;background:rgba(255,255,255,.22);margin:0 auto 10px}
#sheet h2{font-size:22px;font-weight:700;margin:10px 0 2px;letter-spacing:.01em}
#sheet h3{font-size:12px;font-weight:500;color:var(--ink3);letter-spacing:.1em;margin:22px 0 0}
.tpl{display:flex;gap:16px;align-items:center;width:100%;text-align:left;padding:14px 0;border-bottom:.5px solid var(--hair)}
.tpl:last-of-type{border-bottom:0}
.tpl svg.il{width:46px;height:60px;flex:none;border-radius:10px;background:rgba(255,255,255,.06)}
.tpl .t{flex:1;min-width:0}
.tpl b{font-size:17px;font-weight:600;display:block}
.tpl i{font-style:normal;color:var(--ink2);font-size:13.5px;display:block;line-height:1.55}
.tpl .ck{width:20px;height:20px;color:var(--accent);opacity:0;flex:none}
.tpl.act .ck{opacity:1}
.tog{display:flex;align-items:center;gap:12px;padding:14px 0;width:100%;text-align:left;border-bottom:.5px solid var(--hair)}
.tog:last-child{border-bottom:0}
.tog>span:first-child{flex:1}
.tog b{font-weight:500;font-size:16px}
.tog .sw{width:50px;height:30px;border-radius:15px;background:rgba(255,255,255,.16);position:relative;flex:none;transition:background .25s}
.tog .sw::after{content:"";position:absolute;top:2px;left:2px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:transform .3s var(--ease)}
.tog.on .sw{background:var(--accent)} .tog.on .sw::after{transform:translateX(20px)}
.field{display:block;margin-top:14px;font-size:12px;color:var(--ink3);letter-spacing:.06em}
.field input,.field select{margin-top:6px;font-size:16px}
.petRow{display:flex;align-items:center;gap:14px;padding:12px 0;width:100%;text-align:left;border-bottom:.5px solid var(--hair)}
.petRow .av{width:42px;height:42px;border-radius:50%;background:var(--fill);display:grid;place-items:center;font-weight:600;font-size:17px}
.petRow.act .av{background:var(--accent);color:#000}
.petRow b{font-weight:600;font-size:16px}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 70px);transform:translateX(-50%) translateY(-8px) scale(.96);z-index:30;
  background:var(--mat);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);
  padding:11px 18px;border-radius:22px;font-weight:500;font-size:14px;opacity:0;pointer-events:none;transition:all .35s var(--ease);max-width:84%;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}

/* ---------- 選片 ---------- */
#rvMain{flex:1;min-height:0;position:relative;border-radius:24px;overflow:hidden;background:#0b0b0c}
#rvMain img{width:100%;height:100%;object-fit:contain}
#rvBadge{position:absolute;top:14px;left:14px;padding:6px 12px;border-radius:15px;background:rgba(0,0,0,.4);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  color:var(--accent);font-weight:600;font-size:13px;letter-spacing:.08em;display:none}
#rvWhy{margin:14px 24px 2px;font-size:15px;min-height:44px;text-align:center;text-wrap:balance}
#rvWhy b{font-weight:600}
#rvStrip{padding:10px 16px 2px;gap:6px}
#rvStrip button{position:relative;flex:none;width:50px;height:66px;border-radius:9px;overflow:hidden;background:#111;opacity:.4;transition:all .25s var(--ease)}
#rvStrip button.keep{opacity:1}
#rvStrip button.view{opacity:1;box-shadow:0 0 0 2px #000,0 0 0 4px var(--ink);transform:scale(.94)}
#rvStrip img{width:100%;height:100%;object-fit:cover}
#rvStrip .ck{display:none}
#rvStrip .keep::after{content:"";position:absolute;left:50%;bottom:5px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--accent)}
#rvStrip .star{display:none}
.foot{display:flex;gap:10px;padding:14px 20px 16px;flex:none}

/* ---------- 修圖 ---------- */
#edWrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
#edCanvas{max-width:100%;max-height:100%;border-radius:22px;background:#0b0b0c}
#edHold{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;height:34px;padding:0 14px;border-radius:17px;background:rgba(0,0,0,.4);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);font-size:12.5px;font-weight:500;color:var(--ink2)}
#edNote{margin:10px 24px 0;font-size:12.5px;color:var(--ink3);min-height:19px;flex:none;text-align:center}
#edStyles{justify-content:center;padding-top:10px}
.sl{display:flex;align-items:center;gap:14px;padding:10px 24px 0;flex:none}
.sl label{width:60px;font-size:13px;color:var(--ink2);flex:none}
.sl output{width:28px;text-align:right;font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;height:30px;padding:0;border:0;background:transparent;flex:1;border-radius:0}
input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:rgba(255,255,255,.2)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;margin-top:-10.5px;box-shadow:0 2px 8px rgba(0,0,0,.4)}
input[type=range]::-moz-range-track{height:3px;border-radius:2px;background:rgba(255,255,255,.2)}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border:0;border-radius:50%;background:#fff}
input[type=range]:disabled{opacity:.35}
#edSave{color:var(--accent);font-weight:600;font-size:16px}

/* ---------- 相簿 ---------- */
.big{font-size:34px;font-weight:700;margin:0 20px 10px;letter-spacing:.01em;flex:none}
#alBody{flex:1;overflow-y:auto;padding:0 0 16px}
#alBody h3{font-size:13px;color:var(--ink2);margin:22px 20px 10px;font-weight:500;letter-spacing:.04em}
#alBody>p{margin:14px 20px 0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.grid button{position:relative;aspect-ratio:1;overflow:hidden;background:#0b0b0c}
.grid img{width:100%;height:100%;object-fit:cover}
.grid .fv{position:absolute;right:7px;bottom:7px;color:#fff;filter:drop-shadow(0 1px 3px rgba(0,0,0,.6))}
.grid .fv svg{width:14px;height:14px}
.grid .pick{position:absolute;inset:0;box-shadow:inset 0 0 0 3px var(--accent);display:none}
.grid .sel .pick{display:block}
.grid .tag{display:none}
.empty{text-align:center;color:var(--ink2);padding:22vh 40px 0;font-size:15px}
.empty b{display:block;color:var(--ink);font-size:22px;font-weight:600;margin-bottom:8px}
#alFoot .btn{background:none;color:var(--ink2);height:44px;font-weight:500;font-size:15px}
#dtWrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#dtImg{max-width:100%;max-height:100%;border-radius:22px}
#dtMeta{padding:14px 20px 0;font-size:12.5px;color:var(--ink3);flex:none;text-align:center;letter-spacing:.04em}
.acts{display:flex;justify-content:space-around;padding:14px 10px 16px;flex:none}
.acts button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;min-width:56px;color:var(--ink2);letter-spacing:.06em;transition:transform .2s var(--ease)}
.acts button:active{transform:scale(.9)}
.acts svg{width:24px;height:24px;color:var(--ink)}
.acts .on svg{color:var(--accent)}
#cpWrap{flex:1;min-height:0;display:flex;gap:6px;padding:0 6px}
#cpWrap figure{flex:1;margin:0;display:flex;flex-direction:column;gap:12px;min-width:0}
#cpWrap .im{flex:1;min-height:0;border-radius:18px;overflow:hidden;background:#0b0b0c}
#cpWrap img{width:100%;height:100%;object-fit:contain}
#cpWrap .row{padding:0 6px}
#grBody{flex:1;overflow-y:auto;padding:0 24px 16px}
.gr{display:flex;gap:18px;align-items:center;padding:12px 0}
.gr img{width:108px;height:144px;object-fit:cover;border-radius:16px}
.gr b{font-size:22px;font-weight:300;display:block;letter-spacing:.02em}
.gr .muted{font-size:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<section id="cam" class="screen on">
  <div class="top">
    <button class="tbtn" id="petBtn" aria-label="切換寵物"></button>
    <button class="tbtn" id="sceneBtn" aria-label="選擇拍攝情境"></button>
    <div class="tr"><button class="ib" id="torchBtn" aria-label="補光燈" hidden></button><button class="ib" id="flipBtn" aria-label="切換前後鏡頭"></button></div>
  </div>
  <div id="stageWrap"><div id="stage">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="ov"></canvas>
    <div id="msg" role="status"></div>
    <div id="zooms"></div>
    <div id="burstCount"></div>
    <div id="work"><div id="workMsg"></div></div>
  </div></div>
  <div class="scrollx" id="comps" aria-label="構圖"></div>
  <div id="modes" role="tablist">
    <button role="tab" data-m="daily">日常</button>
    <button role="tab" data-m="action">動態</button>
    <button role="tab" data-m="portrait">肖像</button>
  </div>
  <div id="shootRow">
    <button class="sideBtn" id="albumBtn" aria-label="打開相簿"><span class="th"></span>相簿</button>
    <button id="shutter" aria-label="拍照"><b></b></button>
    <button class="sideBtn" id="callBtn" aria-label="發出聲音叫牠看鏡頭，長按可換聲音"><span class="th"></span>叫牠</button>
  </div>
  <div id="startCard">
    <div class="hero">
      <div class="mark"></div>
      <h2>毛孩相機</h2>
      <p>選一個構圖，把牠放進框裡。<br>框亮起來，就拍好了。</p>
    </div>
    <div class="cta">
      <p class="err" id="startErr" hidden></p>
      <button class="btn pri" id="startBtn">開始拍照</button>
      <button class="link" id="importBtn0">從相簿選照片</button>
      <p class="fine">照片只留在這支手機裡</p>
    </div>
  </div>
</section>

<section id="review" class="screen">
  <div class="bar"><button class="ib" id="rvBack" aria-label="全部不要"></button><h1 id="rvTitle"></h1></div>

<script>
'use strict';
/* =====================================================================
   毛孩相機 — 單檔 PWA
   辨識：MediaPipe Tasks Vision（ObjectDetector 找貓狗、ImageSegmenter 取輪廓），全部在手機上運算
   ===================================================================== */
const MP_BASE = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
const DET_MODEL = 'https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/float16/1/efficientdet_lite0.tflite';
const SEG_MODEL = 'https://storage.googleapis.com/mediapipe-models/image_segmenter/deeplab_v3/float32/1/deeplab_v3.tflite';
const ANIMALS = {cat:'貓',dog:'狗',bird:'鳥',horse:'馬',sheep:'羊',cow:'牛',bear:'毛孩'};
const SEG_ANIMAL_IDX = [3,8,10,12,13,17]; // Pascal VOC：bird, cat, cow, dog, horse, sheep

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const ic = (d, fill) => `<svg viewBox="0 0 24 24" fill="${fill?'currentColor':'none'}" stroke="${fill?'none':'currentColor'}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const I = {
  back: ic('<path d="M15 5l-7 7 7 7"/>'), x: ic('<path d="M6 6l12 12M18 6L6 18"/>'),
  flip: ic('<path d="M4 9a8 8 0 0114-3l2 2M20 15a8 8 0 01-14 3l-2-2"/><path d="M20 4v4h-4M4 20v-4h4"/>'),
  torch: ic('<path d="M13 2L5 14h6l-1 8 8-12h-6z"/>'),
  bell: ic('<path d="M6 16V11a6 6 0 0112 0v5l2 2H4z"/><path d="M10 21h4"/>'),
  auto: ic('<circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/>'),
  grid: ic('<path d="M9 4v16M15 4v16M4 9h16M4 15h16"/>'),
  album: ic('<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M4 16l4-4 4 4 3-3 5 5"/>'),
  guide: ic('<path d="M4 8V5a1 1 0 011-1h3M16 4h3a1 1 0 011 1v3M20 16v3a1 1 0 01-1 1h-3M8 20H5a1 1 0 01-1-1v-3"/><circle cx="12" cy="12" r="3"/>'),
  chev: ic('<path d="M6 9l6 6 6-6"/>'), wave: ic('<path d="M4 10v4M8 7v10M12 4v16M16 7v10M20 10v4"/>'),
  check: ic('<path d="M5 12l5 5 9-10"/>'), paw: ic('<circle cx="7" cy="9" r="2"/><circle cx="12" cy="6.5" r="2"/><circle cx="17" cy="9" r="2"/><path d="M12 12c-3 0-5.5 2.5-5.5 5 0 1.6 1.4 2.5 3 2.2 1.700-.3 3.3-.3 5 0 1.600.3 3-.6 3-2.200 0-2.500-2.500-5-5.500-5z"/>', true),
  heart: ic('<path d="M12 20s-7-4.500-7-10a4 4 0 017-2.500A4 4 0 0119 10c0 5.500-7 10-7 10z"/>'),
  heartF: ic('<path d="M12 20s-7-4.500-7-10a4 4 0 017-2.500A4 4 0 0119 10c0 5.500-7 10-7 10z"/>', true),
  wand: ic('<path d="M5 19L16 8M14 6l4 4M18 3v3M16.500 4.500h3M6 5v2M5 6h2"/>'),
  share: ic('<path d="M12 15V4M8 8l4-4 4 4M5 13v6h14v-6"/>'),
  tag: ic('<path d="M4 4h7l9 9-7 7-9-9z"/><circle cx="8.500" cy="8.500" r="1.500"/>'),
  trash: ic('<path d="M5 7h14M9 7V4h6v3M7 7l1 13h8l1-13"/>'),
};

/* ---------------- 情境模板 ---------------- */
// zone = 牠該放的位置與大小 [x,y,w,h]，以取景框為 1
const TPL = {
  head:  {name:'大頭', mode:'portrait', zone:[.13,.10,.74,.62], angle:'蹲低，和牠眼睛同高', steps:['蹲到跟牠眼睛一樣高','靠近，讓臉填滿畫面上的框','按「叫牠」，牠看過來就拍']},
  half:  {name:'半身', mode:'portrait', zone:[.20,.20,.60,.64], angle:'和牠同高，退後半步', steps:['讓牠坐好','頭到胸口放進框裡','背景會自動變柔和']},
  body:  {name:'全身', mode:'daily',    zone:[.16,.30,.68,.52], angle:'蹲下來拍，不要從上往下', steps:['退後到整隻都進框','四周留一點空間，別切到尾巴和腳','背景找乾淨的牆或地板']},
  left:  {name:'靠左', mode:'daily',    zone:[.05,.34,.50,.52], angle:'讓牠看向右邊的空位', steps:['把牠放在左邊的框裡','右邊留白，畫面會更有故事','牠看向右邊時最好看']},
  right: {name:'靠右', mode:'daily',    zone:[.45,.34,.50,.52], angle:'讓牠看向左邊的空位', steps:['把牠放在右邊的框裡','左邊留白','牠看向左邊時最好看']},
  sleep: {name:'睡覺', mode:'daily',    zone:[.10,.30,.80,.42], angle:'從正上方，輕輕往下拍', steps:['不要出聲、不要開補光燈','從正上方慢慢靠近','整隻放進橫的框裡']},
  play:  {name:'玩耍', mode:'action',   zone:[.20,.40,.60,.50], angle:'手機放到地板的高度', steps:['到光線亮的地方，動作才清楚','手機放低，鏡頭跟牠一樣高','牠衝過來時按一下，相機會連拍再幫你挑']},
  bday:  {name:'生日', mode:'portrait', zone:[.20,.08,.60,.50], prop:[.25,.66,.50,.26], propName:'蛋糕', angle:'和牠同高，蛋糕放在前面', steps:['蛋糕或禮物放在下面的框','讓牠坐好，臉放進上面的框','蠟燭點著時不要開補光燈']},
  far:   {name:'遠景', mode:'daily',    zone:[.36,.56,.28,.28], angle:'退後，讓風景當主角', steps:['退得遠遠的','牠小小地站在下方的框裡','上面留給天空或風景']},
};
const SCENE_NAME = id => id==='daily' ? '日常' : (TPL[id] ? TPL[id].name : '日常');
const MODE = {
  daily:    {desc:'自動調整，適合日常隨手拍'},
  action:   {desc:'按一下連拍 10 張，自動挑出最清楚的'},
  portrait: {desc:'辨識寵物輪廓，把背景變柔和'},
};
function tplSvg(id){
  const t=TPL[id],r=z=>`x="${4+z[0]*40}" y="${4+z[1]*56}" width="${z[2]*40}" height="${z[3]*56}"`;
  const g=t?`<rect ${r(t.zone)} rx="4" fill="rgba(255,201,120,.22)" stroke="#ffc978" stroke-width="1.4"/>${t.prop?`<rect ${r(t.prop)} rx="3" fill="none" stroke="#8e8e93" stroke-width="1.2" stroke-dasharray="2 2"/>`:''}`
    :'<path d="M17 24v-4h4M31 20h-4M31 24v-4M17 40v4h4M31 44h-4M31 40v4" transform="translate(0,0)" stroke="#8e8e93" stroke-width="1.4" fill="none" stroke-linecap="round"/>';
  return `<svg class="il" viewBox="0 0 48 64">${g}</svg>`;
}
// 目前偵測框換到「畫面上看到的」座標（前鏡頭左右相反）
function viewBox(){ const b=detBoxNorm(); if(!b) return null; return S.facing==='user'?{...b,x:1-b.x-b.w}:b; }
// 寵物和目標框差多少 → 告訴新手怎麼移
function matchInfo(b,z){
  const s=Math.sqrt((b.w*b.h)/(z[2]*z[3])), dx=(b.x+b.w/2)-(z[0]+z[2]/2), dy=(b.y+b.h/2)-(z[1]+z[3]/2), f=S.facing==='user'?-1:1;
  if(s<.7) return {ok:false,msg:'再靠近一點'};
  if(s>1.4) return {ok:false,msg:'退後一點'};
  if(Math.abs(dx)>.08&&Math.abs(dx)>=Math.abs(dy)) return {ok:false,msg:(dx*f<0)?'手機往左移一點':'手機往右移一點'};
  if(Math.abs(dy)>.08) return {ok:false,msg:dy<0?'手機往上抬一點':'手機往下放一點'};
  return {ok:true,msg:''};
}
function drawTarget(c,W,H,b,ok){
  const t=TPL[S.tpl],z=t.zone,x=z[0]*W,y=z[1]*H,w=z[2]*W,h=z[3]*H,r=Math.min(30,Math.min(w,h)*.2);
  c.save(); c.shadowColor='rgba(0,0,0,.3)'; c.shadowBlur=8;
  if(ok){ c.strokeStyle='rgba(255,201,120,1)'; c.lineWidth=2.5; c.beginPath(); roundRect(c,x,y,w,h,r); c.stroke(); }
  else { c.strokeStyle='rgba(255,255,255,.85)'; c.lineWidth=1.5; c.setLineDash([2,8]); c.lineCap='round'; c.beginPath(); roundRect(c,x,y,w,h,r); c.stroke(); c.setLineDash([]);
    if(b){ const bx=b.x*W,by=b.y*H,bw=b.w*W,bh=b.h*H; c.strokeStyle='rgba(255,255,255,.5)'; c.lineWidth=1; c.beginPath(); roundRect(c,bx,by,bw,bh,Math.min(22,Math.min(bw,bh)*.18)); c.stroke();
      const x0=bx+bw/2,y0=by+bh/2,x1=x+w/2,y1=y+h/2,d=Math.hypot(x1-x0,y1-y0);
      if(d>24){ const ux=(x1-x0)/d,uy=(y1-y0)/d; c.strokeStyle='rgba(255,201,120,.95)'; c.fillStyle='rgba(255,201,120,.95)'; c.lineWidth=2;
        c.beginPath(); c.moveTo(x0,y0); c.lineTo(x1-ux*8,y1-uy*8); c.stroke();
        c.beginPath(); c.moveTo(x1,y1); c.lineTo(x1-ux*12-uy*6,y1-uy*12+ux*6); c.lineTo(x1-ux*12+uy*6,y1-uy*12-ux*6); c.closePath(); c.fill();
        c.beginPath(); c.arc(x0,y0,4,0,7); c.fill(); } } }
  if(t.prop){ const p=t.prop; c.strokeStyle='rgba(255,255,255,.6)'; c.lineWidth=1; c.setLineDash([2,6]); c.beginPath(); roundRect(c,p[0]*W,p[1]*H,p[2]*W,p[3]*H,16); c.stroke(); c.setLineDash([]);
    c.fillStyle='rgba(255,255,255,.85)'; c.font='500 12px '+getComputedStyle(document.body).fontFamily; c.textAlign='center'; c.fillText(t.propName,(p[0]+p[2]/2)*W,(p[1]+p[3]/2)*H+4); }
  c.restore();
}
function roundRect(ctx,x,y,w,h,r){ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

/* ---------------- 資料庫（IndexedDB） ---------------- */
let db=null; const mem={pets:new Map(),photos:new Map(),blobs:new Map()};
function openDB(){return new Promise(res=>{try{
  const q=indexedDB.open('maohai-cam',1);
  q.onupgradeneeded=()=>{const d=q.result;['pets','photos','blobs'].forEach(n=>d.createObjectStore(n,{keyPath:'id'}));};
  q.onsuccess=()=>{db=q.result;res();}; q.onerror=()=>res();
}catch(e){res();}});}
function tx(store,mode,fn){
  if(!db) return Promise.resolve(fn(null));
  return new Promise((res,rej)=>{const t=db.transaction(store,mode);const r=fn(t.objectStore(store));
    t.oncomplete=()=>res(r&&'result' in r?r.result:undefined); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error);});
}
const dbPut=(s,v)=>db?tx(s,'readwrite',o=>o.put(v)):(mem[s].set(v.id,v),Promise.resolve());
const dbGet=(s,id)=>db?tx(s,'readonly',o=>o.get(id)):Promise.resolve(mem[s].get(id));
const dbAll=s=>db?tx(s,'readonly',o=>o.getAll()):Promise.resolve([...mem[s].values()]);
const dbDel=(s,id)=>db?tx(s,'readwrite',o=>o.delete(id)):(mem[s].delete(id),Promise.resolve());
const LS={get(k,d){try{const v=localStorage.getItem('mh.'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem('mh.'+k,JSON.stringify(v));}catch(e){}}};

/* ---------------- 狀態 ---------------- */
const S={snd:LS.get('snd','squeak'), note:null, mode:LS.get('mode','daily'), tpl:null, grid:LS.get('grid',false), auto:LS.get('auto',true), sndShoot:LS.get('sndShoot',true),
  facing:'environment', zoom:1, dz:1, pets:[], petId:LS.get('pet',null), photos:[], busy:false,
  ai:'loading', det:null, bright:128, moving:0, okSince:0, lastAuto:0, focusPt:null};
let stream=null, track=null, caps={}, detector=null, segmenter=null, vision=null, fileset=null;
const video=$('#video'), stage=$('#stage'), ov=$('#ov');

/* ---------------- 提示 ---------------- */
let toastT; function toast(m,ms=2200){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),ms);}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));}
function openSheet(html){$('#sheet').innerHTML='<div class="grab"></div>'+html;$('#sheet').classList.add('on');$('#scrim').classList.add('on');}
function closeSheet(){$('#sheet').classList.remove('on');$('#scrim').classList.remove('on');}
$('#scrim').onclick=closeSheet;
function work(msg){$('#workMsg').textContent=msg||'';$('#work').classList.toggle('on',!!msg);}

/* ---------------- 相機 ---------------- */
async function startCamera(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia) throw new Error('nocam');
  stopCamera();
  stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:S.facing},width:{ideal:1920},height:{ideal:1440}}});
  track=stream.getVideoTracks()[0]; caps=(track.getCapabilities&&track.getCapabilities())||{};
  video.srcObject=stream; await video.play().catch(()=>{});
  $('#torchBtn').hidden=!caps.torch; $('#torchBtn').classList.remove('act');
  try{ if(caps.focusMode&&caps.focusMode.includes('continuous')) await track.applyConstraints({advanced:[{focusMode:'continuous'}]}); }catch(e){}
  setZoom(1); applyVideoTransform();
  try{ if(navigator.wakeLock) navigator.wakeLock.request('screen').catch(()=>{}); }catch(e){}
}
function stopCamera(){ if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;track=null;} }
function applyVideoTransform(){ video.style.transform=`scale(${S.facing==='user'?-S.dz:S.dz},${S.dz})`; }
function setZoom(z){
  S.zoom=z; let native=1;
  if(caps.zoom&&track){ const base=Math.max(caps.zoom.min||1,1); native=clamp(z*base,caps.zoom.min,caps.zoom.max);
    track.applyConstraints({advanced:[{zoom:native}]}).catch(()=>{}); S.dz=z/(native/base); }
  else S.dz=z;
  if(S.dz<1.01) S.dz=1;
  applyVideoTransform();
  $('#zooms').innerHTML=[1,2,3].map(v=>`<button class="${v===z?'act':''}" data-z="${v}">${v}×</button>`).join('');
}
$('#zooms').onclick=e=>{const b=e.target.closest('button');if(b)setZoom(+b.dataset.z);};
// 取景框實際看到的範圍，換算回影像像素
function cropRect(){
  const vw=video.videoWidth,vh=video.videoHeight,R=stage.clientWidth/stage.clientHeight;
  let cw=vw,ch=vw/R; if(ch>vh){ch=vh;cw=vh*R;} cw/=S.dz; ch/=S.dz;
  return {sx:(vw-cw)/2,sy:(vh-ch)/2,cw,ch};
}
function grabFrame(maxLong){
  const {sx,sy,cw,ch}=cropRect(); let k=1; if(maxLong) k=Math.min(1,maxLong/Math.max(cw,ch));
  const c=document.createElement('canvas'); c.width=Math.round(cw*k); c.height=Math.round(ch*k);
  c.getContext('2d').drawImage(video,sx,sy,cw,ch,0,0,c.width,c.height); return c;
}
function detBoxNorm(){ // 目前偵測框，換成取景框內 0~1 座標
  if(!S.det) return null; const {sx,sy,cw,ch}=cropRect(), d=S.det;
  const x0=clamp((d.x-sx)/cw,0,1),y0=clamp((d.y-sy)/ch,0,1),x1=clamp((d.x+d.w-sx)/cw,0,1),y1=clamp((d.y+d.h-sy)/ch,0,1);
  if(x1-x0<.03||y1-y0<.03) return null;
  return {x:x0,y:y0,w:x1-x0,h:y1-y0,score:d.score,kind:d.kind,cut:(d.x-sx)/cw<.01||(d.y-sy)/ch<.01||(d.x+d.w-sx)/cw>.99||(d.y+d.h-sy)/ch>.99};
}
$('#flipBtn').onclick=async()=>{S.facing=S.facing==='user'?'environment':'user';S.det=null;try{await startCamera();}catch(e){toast('切換鏡頭失敗');}};
$('#torchBtn').onclick=async()=>{const on=!$('#torchBtn').classList.contains('act');try{await track.applyConstraints({advanced:[{torch:on}]});$('#torchBtn').classList.toggle('act',on);}catch(e){toast('這顆鏡頭沒有補光燈');}};
stage.addEventListener('pointerdown',e=>{ // 點一下對焦（支援的手機才有效，其餘維持自動對焦）
  if(e.target.closest('button')||!track) return;
  const r=stage.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
  S.focusPt={x,y,t:performance.now()};
  if(caps.focusMode){ const adv={pointsOfInterest:[{x,y}]}; if(caps.focusMode.includes('single-shot')) adv.focusMode='single-shot';
    track.applyConstraints({advanced:[adv]}).then(()=>{ if(caps.focusMode.includes('continuous')) setTimeout(()=>track&&track.applyConstraints({advanced:[{focusMode:'continuous'}]}).catch(()=>{}),2500); }).catch(()=>{}); }
});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden) return;
  if($('#startCard').hidden&&(!track||track.readyState!=='live')) startCamera().catch(()=>{});
});

/* ---------------- AI 載入 ---------------- */
async function loadAI(){
  try{
    vision=await import(MP_BASE+'/vision_bundle.mjs');
    fileset=await vision.FilesetResolver.forVisionTasks(MP_BASE+'/wasm');
    const opt=d=>({baseOptions:{modelAssetPath:DET_MODEL,delegate:d},runningMode:'VIDEO',scoreThreshold:.3,maxResults:4,categoryAllowlist:Object.keys(ANIMALS)});
    try{detector=await vision.ObjectDetector.createFromOptions(fileset,opt('GPU'));}
    catch(e){detector=await vision.ObjectDetector.createFromOptions(fileset,opt('CPU'));}
    S.ai='ready';
  }catch(e){ console.warn('AI 載入失敗',e); S.ai='off'; }
}
let segLoading=null;
function loadSeg(){
  if(segmenter) return Promise.resolve(segmenter);
  if(!vision) return Promise.resolve(null);
  if(!segLoading) segLoading=(async()=>{

      for(let y=1;y<h-1;y++){ let i=(y*w+1)*4; for(let x=1;x<w-1;x++,i+=4){ for(let k=0;k<3;k++){ const j=i+k; d[j]=s[j]+amt*(4*s[j]-s[j-4]-s[j+4]-s[j-W4]-s[j+W4]); } } } }
    ctx.putImageData(id,0,0);
  }
  if(edit.blur>0&&mask){
    const bg=blurred(out,edit.blur/100),tmp=document.createElement('canvas'); tmp.width=w; tmp.height=h; const tx_=tmp.getContext('2d');
    tx_.imageSmoothingQuality='high'; tx_.drawImage(maskCanvas(mask),0,0,w,h); tx_.globalCompositeOperation='source-in'; tx_.drawImage(out,0,0);
    const bx=bg.getContext('2d'); bx.drawImage(tmp,0,0); return bg;
  }
  return out;
}

let RV=null;
function scoreFrames(frames){
  for(const f of frames){ const a=analyze(f.canvas,f.box); f.sharp=a.sharp; f.bright=a.bright; }
  const mx=Math.max(...frames.map(f=>f.sharp),1e-6);
  for(const f of frames){ const b=f.box, sh=f.sharp/mx, ex=1-clamp(Math.abs(f.bright-125)/110,0,1);
    const fr=b?((b.cut?0:1)*.6+clamp(b.w*b.h/.25,0,1)*.4):.3, cf=b?b.score:.3;
    f.parts={sh,ex,fr,cf}; f.score=sh*.58+fr*.2+cf*.12+ex*.1; }
  const order=[...frames].sort((a,b)=>b.score-a.score); order.forEach((f,i)=>f.rank=i); return order[0];
}
function whyText(f,frames){ const r=[]; const p=f.parts;
  if(p.sh>=.97&&frames.length>1) r.push('這組裡最清楚'); else if(p.sh>.8) r.push('夠清楚');
  if(f.box&&!f.box.cut) r.push('寵物完整在畫面裡'); if(!f.box) r.push('沒辨識到寵物，只比了清晰度');
  if(p.ex>.7) r.push('亮度剛好'); else if(f.bright<70) r.push('偏暗'); else if(f.bright>190) r.push('偏亮');
  return r.join('、'); }
async function openReview(frames,scene,mode){

  RV={frames,scene,mode,view:frames.indexOf(best),best}; show('review'); renderReview();
}

}

function renderPetBtn(){ $('#petBtn').innerHTML=`<span>${esc(petName(S.petId))}</span>`+I.chev; }
function petSheet(){
  openSheet(`<h2>現在拍的是誰？</h2><p class="muted small">照片會自動歸到這隻寵物的相簿。</p>
   ${S.pets.map(p=>`<button class="petRow ${p.id===S.petId?'act':''}" data-id="${esc(p.id)}"><span class="av">${esc(p.name.slice(0,1))}</span><span><b>${esc(p.name)}</b><br><span class="muted small">${esc(p.kind)}${p.birthday?' · 生日 '+esc(p.birthday):''}</span></span></button>`).join('')}
   <h2 style="margin-top:20px">新增或修改</h2>
   <label class="field">名字<input id="pfName" maxlength="12" placeholder="例如：麻糬" value=""></label>
   <label class="field">種類<select id="pfKind"><option>貓</option><option>狗</option><option>兔子</option><option>鳥</option><option>其他</option></select></label>
   <label class="field">生日（選填，用來算成長紀錄的月齡）<input id="pfBirth" type="date"></label>
   <div class="row" style="margin-top:16px"><button class="btn wide" id="pfEdit">改目前這隻</button><button class="btn pri wide" id="pfAdd">新增一隻</button></div>`);
  const cur=S.pets.find(p=>p.id===S.petId); if(cur){$('#pfName').value=cur.name;$('#pfKind').value=cur.kind;$('#pfBirth').value=cur.birthday||'';}
  $('#sheet').onclick=async e=>{ const r=e.target.closest('.petRow');
    if(r){S.petId=r.dataset.id;LS.set('pet',S.petId);renderPetBtn();closeSheet();return;}
    const add=e.target.closest('#pfAdd'),ed=e.target.closest('#pfEdit'); if(!add&&!ed) return;
    const name=$('#pfName').value.trim(); if(!name){toast('先填名字');return;}
    const p=add?{id:'p'+Date.now().toString(36)}:cur; p.name=name;p.kind=$('#pfKind').value;p.birthday=$('#pfBirth').value||'';
    await dbPut('pets',p); if(add)S.pets.push(p); S.petId=p.id; LS.set('pet',p.id); renderPetBtn(); closeSheet(); toast(add?`已新增${name}`:'已更新'); };
}
$('#petBtn').onclick=petSheet;
function setMode(m,quiet){ S.mode=m; LS.set('mode',m); document.querySelectorAll('#modes button').forEach(b=>{b.classList.toggle('act',b.dataset.m===m);b.setAttribute('aria-selected',b.dataset.m===m);});
  if(m==='portrait') loadSeg(); if(!quiet){ note(MODE[m].desc); if(navigator.vibrate) navigator.vibrate(8); } }
$('#modes').onclick=e=>{const b=e.target.closest('button');if(b)setMode(b.dataset.m);};
function renderSceneBtn(){ $('#sceneBtn').innerHTML=`<span>${S.tpl?TPL[S.tpl].name:'自由拍'}</span>`+I.chev;
  $('#comps').innerHTML=[['','自由'],...Object.entries(TPL).map(([k,t])=>[k,t.name])].map(([k,n])=>`<button data-t="${k}" class="${(S.tpl||'')===k?'act':''}" aria-label="${n}構圖">${tplSvg(k)}${n}</button>`).join(''); }
function setTpl(id){ S.tpl=id||null; S.okSince=0; renderSceneBtn(); if(S.tpl){ setMode(TPL[S.tpl].mode,true); note(TPL[S.tpl].angle,3200); if(navigator.vibrate) navigator.vibrate(8); }
  const a=$('#comps .act'); if(a&&a.scrollIntoView) a.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'}); }
$('#comps').onclick=e=>{const b=e.target.closest('button');if(b)setTpl(b.dataset.t);};
function sceneSheet(){
  const row=(k,name,lines)=>`<button class="tpl ${(S.tpl||'')===k?'act':''}" data-t="${k}">${tplSvg(k)}<span class="t"><b>${name}</b>${lines.map(s=>`<i>${s}</i>`).join('')}</span><span class="ck">${I.check}</span></button>`;
  openSheet(`<h2>想把牠放在哪裡？</h2><p class="muted small" style="margin:0 0 6px">選一種，畫面上會出現一個框。把牠放進去就好。</p>`+row('','自由拍',['看到就拍，不用對位'])+Object.entries(TPL).map(([k,t])=>row(k,t.name,t.steps)).join('')+
    `<h3>輔助</h3><button class="tog ${S.auto?'on':''}" id="tgAuto"><span><b>對進框裡時自動拍</b></span><span class="sw"></span></button>
     <button class="tog ${S.grid?'on':''}" id="tgGrid"><span><b>顯示構圖格線</b></span><span class="sw"></span></button>`);
  $('#sheet').onclick=e=>{ const b=e.target.closest('.tpl'); if(b){ setTpl(b.dataset.t); closeSheet(); return; }
    if(e.target.closest('#tgAuto')){ S.auto=!S.auto; LS.set('auto',S.auto); $('#tgAuto').classList.toggle('on',S.auto); }
    if(e.target.closest('#tgGrid')){ S.grid=!S.grid; LS.set('grid',S.grid); $('#tgGrid').classList.toggle('on',S.grid); } };
}
$('#sceneBtn').onclick=sceneSheet;
$('#flipBtn').innerHTML=I.flip; $('#torchBtn').innerHTML=I.torch; $('#callBtn .th').innerHTML=I.wave;

/* ---------------- 啟動 ---------------- */
$('#startBtn').onclick=async()=>{
  audio(); $('#startErr').hidden=true;
  try{ await startCamera(); $('#startCard').hidden=true; if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{}); }
  catch(e){ const el=$('#startErr'); el.hidden=false;
    el.textContent = !window.isSecureContext||e.message==='nocam' ? '這個網址開不了鏡頭。請改用 https 網址打開，或先從相簿選照片。'
      : e.name==='NotAllowedError' ? '需要你允許使用相機。到瀏覽器的網站設定打開它，再按一次。'
      : '找不到可用的相機，請確認沒有其他 App 正在使用鏡頭。'; }
};
(async function init(){
  await openDB();
  S.pets=await dbAll('pets'); if(!S.pets.length){const p={id:'p0',name:'我的毛孩',kind:'貓',birthday:''};await dbPut('pets',p);S.pets=[p];}
  if(!S.pets.some(p=>p.id===S.petId)) S.petId=S.pets[0].id;
  S.photos=await dbAll('photos');
  renderPetBtn(); renderSceneBtn(); renderAlbumBtn(); setMode(S.mode,true); setZoom(1);
  requestAnimationFrame(tick); loadAI();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="用手機鏡頭掃描文件，自動裁切、拉正，一次拍多張並排序，輸出彩色或黑白 PDF。">
<meta name="theme-color" content="#f4f4f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121314" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="文件掃描">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>文件掃描</title>
<style>
:root{
  /* 設計：像一疊紙。暖白底、墨色字、一個藍色只用在「下一步」上。 */
  --bg:#f4f4f1; --card:#fff; --ink:#18191b; --ink2:#5d6066; --ink3:#9a9da3;
  --line:rgba(0,0,0,.09); --fill:rgba(0,0,0,.055); --stage:#e4e4e0;
  --accent:#2f62e8; --accent-ink:#fff; --bad:#d6402f;
  --shadow:0 1px 2px rgba(0,0,0,.08),0 4px 14px rgba(0,0,0,.06);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#121314;--card:#1d1e20;--ink:#f2f2f0;--ink2:#a6a8ad;--ink3:#6b6e74;--line:rgba(255,255,255,.1);--fill:rgba(255,255,255,.08);--stage:#08090a;--accent:#5b88ff;--shadow:0 1px 2px rgba(0,0,0,.5)}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);overscroll-behavior:none}
body{font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible,label:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{display:block}
[hidden]{display:none!important}
.screen{position:fixed;inset:0;display:none;flex-direction:column;background:var(--bg);
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.screen.on{display:flex}
.bar{display:flex;align-items:center;gap:4px;padding:6px 8px;min-height:56px;flex:none}
.bar h1{font-size:18px;margin:0 0 0 8px;font-weight:700;flex:1;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar h1.c{text-align:center;margin:0}
.ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;transition:background .15s}
.ib:active{background:var(--fill)}
.ib svg{width:22px;height:22px}
.btn{height:50px;padding:0 20px;border-radius:25px;background:var(--fill);font-weight:600;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s var(--ease);white-space:nowrap}
.btn:active:not(:disabled){transform:scale(.97)}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn svg{width:20px;height:20px}
.muted{color:var(--ink2)} .small{font-size:13px}

/* ---------- 首頁：頁面清單 ---------- */
#home main{flex:1;overflow-y:auto;padding:4px 14px 120px;-webkit-overflow-scrolling:touch}
.hint{font-size:13px;color:var(--ink2);margin:0 2px 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
.card{position:relative;aspect-ratio:3/4;border-radius:10px;background:var(--card);box-shadow:var(--shadow);overflow:hidden;
  -webkit-touch-callout:none;-webkit-user-select:none;user-select:none;cursor:pointer;transition:transform .18s var(--ease),opacity .18s}
.card img{position:absolute;inset:6px;width:calc(100% - 12px);height:calc(100% - 12px);object-fit:contain;pointer-events:none}
.card .no{position:absolute;left:6px;bottom:6px;min-width:26px;height:26px;padding:0 7px;border-radius:13px;background:rgba(20,20,22,.78);color:#fff;font-size:13px;font-weight:700;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.card .tag{position:absolute;right:6px;bottom:6px;height:22px;padding:0 8px;border-radius:11px;background:rgba(255,255,255,.88);color:#333;font-size:11px;font-weight:600;display:grid;place-items:center}
.card.ph{opacity:.25}
.card.loading::after{content:"";position:absolute;inset:0;margin:auto;width:22px;height:22px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--ink2);animation:spin .8s linear infinite}
.ghost{position:fixed;z-index:50;pointer-events:none;transform:scale(1.06) rotate(-2deg);box-shadow:0 12px 30px rgba(0,0,0,.28);opacity:.95}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:56px 24px 0;gap:6px}
.empty svg{width:96px;height:96px;color:var(--ink3);margin-bottom:10px}
.empty h2{margin:0;font-size:20px}
.empty p{margin:0;color:var(--ink2);max-width:300px}
.dock{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center;
  background:linear-gradient(to top,var(--bg) 70%,transparent)}
.dock .btn{flex:1}
.dock .shoot{flex:1.3}

/* ---------- 相機 ---------- */
#cam{background:#000;color:#fff}
#cam .view{position:relative;flex:1;overflow:hidden}
#cam video,#cam #ov{position:absolute;inset:0;width:100%;height:100%}
#cam video{object-fit:cover}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
#flash.on{opacity:.7;transition:none}
#cam .ctop{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:8px;z-index:2}
#cam .ctop .ib{background:rgba(0,0,0,.45);color:#fff}
#cam .ctop .ib.act{background:#fff;color:#000}
#cam .status{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:rgba(0,0,0,.5);padding:6px 14px;border-radius:16px;font-size:14px;white-space:nowrap;z-index:2}
#cam .cbot{flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:18px 20px 22px;background:#000}
.shutter{width:76px;height:76px;border-radius:50%;border:4px solid #fff;display:grid;place-items:center}
.shutter::after{content:"";width:62px;height:62px;border-radius:50%;background:#fff;transition:transform .12s}
.shutter:active::after{transform:scale(.88)}
.lastshot{justify-self:start;position:relative;width:52px;height:52px;border-radius:8px;background:#222 center/cover no-repeat;border:2px solid rgba(255,255,255,.7)}
.lastshot b{position:absolute;right:-8px;top:-8px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--accent);font-size:12px;display:grid;place-items:center}
.done{justify-self:end;height:44px;padding:0 18px;border-radius:22px;background:#fff;color:#000;font-weight:700}
.camerr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:30px;text-align:center}
.camerr .btn{background:#fff;color:#000}

/* ---------- 編輯 ---------- */
#edit .stage{position:relative;flex:1;background:var(--stage);overflow:hidden;display:flex;align-items:center;justify-content:center;touch-action:none}
#edit .stage>canvas{max-width:calc(100% - 28px);max-height:calc(100% - 28px);box-shadow:0 2px 12px rgba(0,0,0,.25);background:#fff}
.navb{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:64px;display:grid;place-items:center;color:var(--ink2);z-index:2}
.navb svg{width:26px;height:26px}
.navb.l{left:0}.navb.r{right:0}
.spin{position:absolute;inset:0;margin:auto;width:30px;height:30px;border-radius:50%;border:3px solid rgba(128,128,128,.3);border-top-color:var(--ink2);animation:spin .8s linear infinite;z-index:3}
#crop{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--stage);touch-action:none}
#crop .wrap{position:relative}
#crop canvas{display:block}
#crop svg{position:absolute;inset:0;overflow:visible}
#crop polygon{fill:rgba(47,98,232,.14);stroke:var(--accent);stroke-width:2}
#crop .h{fill:#fff;stroke:var(--accent);stroke-width:3}
#crop .hit{fill:transparent;cursor:grab}
#loupe{position:fixed;width:120px;height:120px;border-radius:50%;border:3px solid #fff;box-shadow:0 4px 16px rgba(0,0,0,.35);pointer-events:none;z-index:60;background:#000}
.panel{flex:none;padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
.seg{display:flex;background:var(--fill);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;height:38px;border-radius:9px;font-size:15px;font-weight:500;color:var(--ink2)}
.seg button.act{background:var(--card);color:var(--ink);font-weight:700;box-shadow:var(--shadow)}
.slider{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink2);padding:0 4px}
.slider input{flex:1;accent-color:var(--accent)}
.tools{display:flex;justify-content:space-around}
.tool{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--ink2);min-width:64px;padding:4px 0}
.tool svg{width:24px;height:24px;color:var(--ink)}
.tool:disabled svg{color:var(--ink3)}
.croptools{display:flex;gap:8px}
.croptools .btn{flex:1;height:46px;padding:0 10px;font-size:15px}

/* ---------- 底部面板 / 提示 ---------- */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;display:none}
.sheet-bg.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--bg);border-radius:18px 18px 0 0;padding:8px 18px calc(18px + env(safe-area-inset-bottom));
  transform:translateY(105%);transition:transform .28s var(--ease);max-height:92dvh;overflow-y:auto;max-width:560px;margin:0 auto}
.sheet.on{transform:none}
.sheet .grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.sheet h2{font-size:19px;margin:0 0 14px}
.field{margin-bottom:16px}
.field>label,.field>.lab{display:block;font-size:14px;font-weight:600;color:var(--ink2);margin-bottom:6px}
.field input[type=text]{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;padding:0 14px}
.field .note{font-size:13px;color:var(--ink2);margin-top:6px}
.sheet .btn{width:100%}
.sheet .row{display:flex;gap:10px}
.sheet .row .btn{flex:1}
.menu button{display:flex;align-items:center;gap:12px;width:100%;height:52px;font-size:16px;border-bottom:1px solid var(--line);text-align:left}
.menu button svg{width:22px;height:22px;color:var(--ink2)}
.menu button.bad{color:var(--bad)}
.menu button.bad svg{color:var(--bad)}
.result{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;background:var(--card);margin-bottom:14px}
.result svg{width:34px;height:34px;color:var(--bad);flex:none}
.result b{display:block;word-break:break-all}
.prog{height:6px;border-radius:3px;background:var(--fill);overflow:hidden;margin:6px 0 10px}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;z-index:70;background:#222;color:#fff;
  padding:10px 16px;border-radius:22px;font-size:15px;display:flex;gap:14px;align-items:center;transition:opacity .2s,transform .2s;pointer-events:none;max-width:calc(100% - 32px)}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{color:#8fb0ff;font-weight:700}
.ver{font-size:12px;color:var(--ink3);text-align:center;margin-top:12px}
</style>
</head>
<body>

<!-- 首頁 -->
<section class="screen on" id="home">
  <div class="bar">
    <h1>文件掃描</h1>
    <button class="ib" id="menuBtn" aria-label="更多選項"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
  </div>
  <main>
    <p class="hint" id="hint" hidden>點一下編輯・長按拖曳可調整順序</p>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty">
      <svg viewBox="0 0 96 96" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"><path d="M26 10h32l18 18v58H26z"/><path d="M58 10v18h18"/><path d="M36 46h30M36 56h30M36 66h20"/><path d="M8 26V12a4 4 0 0 1 4-4h8M88 70v14a4 4 0 0 1-4 4h-8" stroke-linecap="round"/></svg>
      <h2>拍下文件，轉成 PDF</h2>
      <p>可以連拍多頁，自動找邊緣、拉正，選彩色或黑白，拖曳排序後一次輸出。</p>
    </div>
  </main>
  <div class="dock">
    <button class="btn" id="pickBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg>相簿</button>
    <button class="btn pri shoot" id="shootBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>拍照</button>
    <button class="btn" id="exportBtn" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/><path d="M12 11v6m-3-3 3 3 3-3" stroke-linecap="round"/></svg>PDF</button>
  </div>
  <input type="file" id="fileIn" accept="image/*" multiple hidden>
  <input type="file" id="sysCamIn" accept="image/*" capture="environment" hidden>
</section>

<!-- 相機 -->
<section class="screen" id="cam">
  <div class="view">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="ov"></canvas>
    <div id="flash"></div>
    <div class="ctop">
      <button class="ib" id="camClose" aria-label="關閉相機"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      <button class="ib" id="torchBtn" aria-label="手電筒" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg></button>
    </div>
    <div class="status" id="camStatus">對準文件，看到藍框就可以拍</div>
    <div class="camerr" id="camErr" hidden>
      <p id="camErrMsg">無法開啟相機</p>
      <button class="btn" id="camSys">改用手機內建相機</button>
    </div>
  </div>
  <div class="cbot">
    <button class="lastshot" id="lastShot" aria-label="完成並查看頁面"><b id="shotCount">0</b></button>
    <button class="shutter" id="shutter" aria-label="拍照"></button>
    <button class="done" id="camDone">完成</button>
  </div>
</section>

<!-- 編輯單頁 -->
<section class="screen" id="edit">
  <div class="bar">
    <button class="ib" id="edBack" aria-label="返回"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg></button>
    <h1 class="c" id="edTitle">第 1 頁</h1>
    <button class="ib" id="edDel" aria-label="刪除這一頁"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
  </div>
  <div class="stage" id="stage">
    <button class="navb l" id="edPrev" aria-label="上一頁"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m15 5-7 7 7 7"/></svg></button>
    <button class="navb r" id="edNext" aria-label="下一頁"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m9 5 7 7-7 7"/></svg></button>
    <div class="spin" id="edSpin" hidden></div>
    <div id="crop" hidden><div class="wrap"><canvas id="cropCv"></canvas><svg id="cropSvg"></svg></div></div>
  </div>
  <div class="panel" id="viewPanel">
    <div class="seg" id="filterSeg">
      <button data-f="original">原圖</button><button data-f="color">彩色</button><button data-f="gray">灰階</button><button data-f="bw">黑白</button>
    </div>
    <div class="slider" id="thrRow" hidden><span>淡</span><input type="range" id="thr" min="0" max="100" step="1" aria-label="黑白濃淡"><span>濃</span></div>
    <div class="tools">
      <button class="tool" id="tCrop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 2v16h16M2 6h16v16"/></svg>裁切</button>
      <button class="tool" id="tRot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>旋轉</button>
      <button class="tool" id="tUp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5m-6 6 6-6 6 6"/></svg>往前移</button>
      <button class="tool" id="tDown"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14m-6-6 6 6 6-6"/></svg>往後移</button>
    </div>
  </div>
  <div class="panel" id="cropPanel" hidden>
    <p class="small muted" style="margin:0;text-align:center">拖曳四個角對齊文件邊緣</p>
    <div class="croptools">
      <button class="btn" id="cAuto">自動偵測</button>
      <button class="btn" id="cFull">整張</button>
    </div>
    <div class="croptools">
      <button class="btn" id="cCancel">取消</button>
      <button class="btn pri" id="cApply">套用</button>
    </div>
  </div>
</section>

<canvas id="loupe" width="240" height="240" hidden></canvas>

<!-- 底部面板 -->
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="exportSheet" role="dialog" aria-labelledby="exTitle">
  <div class="grab"></div>
  <div id="exForm">
    <h2 id="exTitle">輸出 PDF</h2>
    <div class="field">
      <label for="exName">檔名</label>
      <input type="text" id="exName" autocomplete="off">
    </div>
    <div class="field">
      <div class="lab">色彩</div>
      <div class="seg" id="exColor">
        <button data-v="page">依各頁</button><button data-v="color">彩色</button><button data-v="gray">灰階</button><button data-v="bw">黑白</button>
      </div>
      <div class="note" id="exColorNote"></div>
    </div>
    <div class="field">
      <div class="lab">紙張</div>
      <div class="seg" id="exPaper">
        <button data-v="a4">A4</button><button data-v="letter">Letter</button><button data-v="fit">照原比例</button>
      </div>
    </div>
    <div class="field">
      <div class="lab">畫質</div>
      <div class="seg" id="exQual">
        <button data-v="s">標準（檔案小）</button><button data-v="h">高畫質</button>
      </div>
    </div>
    <button class="btn pri" id="exGo">產生 PDF</button>
  </div>
  <div id="exBusy" hidden>
    <h2>正在產生 PDF…</h2>
    <div class="prog"><i id="exBar"></i></div>
    <p class="muted small" id="exStep"></p>
  </div>
  <div id="exDone" hidden>
    <h2>完成了</h2>
    <div class="result">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M6 2h9l5 5v15H6z"/><path d="M15 2v5h5"/><text x="7.5" y="18" font-size="5.5" font-weight="700" fill="currentColor" stroke="none" font-family="sans-serif">PDF</text></svg>
      <div><b id="exFile"></b><span class="muted small" id="exInfo"></span></div>
    </div>
    <div class="row" style="margin-bottom:10px">
      <button class="btn" id="exView">預覽</button>
      <button class="btn" id="exDl">下載</button>
    </div>
    <button class="btn pri" id="exShare">分享 / 存到檔案</button>
  </div>
</div>
<div class="sheet menu" id="menuSheet" role="dialog" aria-label="更多選項">
  <div class="grab"></div>

<script>
(() => {
"use strict";
const VERSION = "1.0.0";
const $ = id => document.getElementById(id);
const FULL = [0, 0, 1, 0, 1, 1, 0, 1];
const FILTER_NAME = { original: "原圖", color: "彩色", gray: "灰階", bw: "黑白" };
const prefs = Object.assign({ filter: "color", exColor: "page", exPaper: "a4", exQual: "s" },
  JSON.parse(localStorage.getItem("scanPrefs") || "{}"));
const savePrefs = () => localStorage.setItem("scanPrefs", JSON.stringify(prefs));
$("ver").textContent = "版本 " + VERSION;

/* ================= 儲存（IndexedDB）：重新整理也不會掉頁 ================= */
const DB = (() => {
  let dbp;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open("doc-scanner", 1);
    r.onupgradeneeded = () => { r.result.createObjectStore("pages", { keyPath: "id" }); r.result.createObjectStore("meta"); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const tx = async (store, mode, fn) => {
    const db = await open();
    return new Promise((res, rej) => {
      const t = db.transaction(store, mode), out = fn(t.objectStore(store));
      t.oncomplete = () => res(out instanceof IDBRequest ? out.result : out);
      t.onerror = t.onabort = () => rej(t.error);
    });
  };
  return {
    put: p => tx("pages", "readwrite", s => s.put(p)),
    del: id => tx("pages", "readwrite", s => s.delete(id)),
    clear: () => tx("pages", "readwrite", s => s.clear()),
    all: () => tx("pages", "readonly", s => s.getAll()),
    get: k => tx("meta", "readonly", s => s.get(k)),
    set: (k, v) => tx("meta", "readwrite", s => s.put(v, k)),
  };
})();

let pages = [];   // {id, blob, w, h, corners, rot, filter, thr, thumb(blob), url}
const record = p => ({ id: p.id, blob: p.blob, w: p.w, h: p.h, corners: p.corners, rot: p.rot, filter: p.filter, thr: p.thr, thumb: p.thumb });
const save = p => DB.put(record(p)).catch(() => toast("儲存空間不足，頁面可能無法保留"));
const saveOrder = () => DB.set("order", pages.map(p => p.id)).catch(() => {});
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

/* ================= 影像工具 ================= */
function mkCanvas(w, h) { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; }
const ctxOf = c => c.getContext("2d", { willReadFrequently: true });
function loadImg(blob) {
  return new Promise((res, rej) => {
    const u = URL.createObjectURL(blob), im = new Image();
    im.onload = () => { URL.revokeObjectURL(u); res(im); };
    im.onerror = () => { URL.revokeObjectURL(u); rej(new Error("無法讀取圖片")); };
    im.src = u;
  });
}
const dims = s => [s.naturalWidth || s.videoWidth || s.width, s.naturalHeight || s.videoHeight || s.height];
function scaledCanvas(src, maxSide) {
  const [sw, sh] = dims(src), k = Math.min(1, maxSide / Math.max(sw, sh));
  const c = mkCanvas(Math.max(1, Math.round(sw * k)), Math.max(1, Math.round(sh * k)));
  const x = ctxOf(c); x.imageSmoothingQuality = "high"; x.drawImage(src, 0, 0, c.width, c.height);
  return c;
}
const toBlob = (c, type, q) => new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error("encode")), type, q));
const tick = () => new Promise(r => setTimeout(r, 0));

/* ---------- 自動找文件四個角 ---------- */
function boxBlur(src, w, h) {
  const tmp = new Float32Array(w * h), out = new Float32Array(w * h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = y * w + x, l = x > 0 ? i - 1 : i, r = x < w - 1 ? i + 1 : i;
    tmp[i] = (src[l] + src[i] + src[r]) / 3;
  }
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = y * w + x, u = y > 0 ? i - w : i, d = y < h - 1 ? i + w : i;
    out[i] = (tmp[u] + tmp[i] + tmp[d]) / 3;

}
function convexHull(pts) {

  const cr = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lo = [], up = [];
  for (const p of pts) { while (lo.length >= 2 && cr(lo[lo.length - 2], lo[lo.length - 1], p) <= 0) lo.pop(); lo.push(p); }
  for (let i = pts.length - 1; i >= 0; i--) { const p = pts[i]; while (up.length >= 2 && cr(up[up.length - 2], up[up.length - 1], p) <= 0) up.pop(); up.push(p); }

const polyArea = P => { let s = 0; for (let i = 0; i < P.length; i++) { const a = P[i], b = P[(i + 1) % P.length]; s += a[0] * b[1] - b[0] * a[1]; } return s / 2; };

function detectQuad(img) {

  const er = new Uint8Array(N);

    const i = y * w + x; er[i] = bin[i] & bin[i - 1] & bin[i + 1] & bin[i - w] & bin[i + w];

    while (sp) {
      const i = stack[--sp], x = i % w, y = (i / w) | 0; area++;
      if (x <= 3) tl++; if (x >= w - 4) tr++; if (y <= 3) tt++; if (y >= h - 4) tb++;

      if (er[i + 1] && !lab[i + 1]) { lab[i + 1] = L; stack[sp++] = i + 1; }
      if (er[i - w] && !lab[i - w]) { lab[i - w] = L; stack[sp++] = i - w; }

  if (!bestLab || bestA < N * 0.1 || bestTouch >= 3) return null;

  for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) {
    const i = y * w + x;
    if (lab[i] === bestLab && (lab[i - 1] !== bestLab || lab[i + 1] !== bestLab || lab[i - w] !== bestLab || lab[i + w] !== bestLab)) pts.push([x, y]);
  }
  let H = convexHull(pts);
  if (H.length < 4) return null;
  const hullA = Math.abs(polyArea(H));
  while (H.length > 4) {
    let mi = 0, ma = Infinity;
    for (let i = 0; i < H.length; i++) {
      const a = triArea(H[(i - 1 + H.length) % H.length], H[i], H[(i + 1) % H.length]);
      if (a < ma) { ma = a; mi = i; }
    }
    H.splice(mi, 1);
  }
  const qa = Math.abs(polyArea(H));
  if (qa < N * 0.1 || qa / hullA < 0.88) return null;
  // 角度檢查：每個角 25°~155°
  for (let i = 0; i < 4; i++) {
    const a = H[(i + 3) % 4], b = H[i], c = H[(i + 1) % 4];
    const v1 = [a[0] - b[0], a[1] - b[1]], v2 = [c[0] - b[0], c[1] - b[1]];
    const cos = (v1[0] * v2[0] + v1[1] * v2[1]) / (Math.hypot(...v1) * Math.hypot(...v2));
    if (Math.abs(cos) > 0.9) return null;
  }
  if (polyArea(H) < 0) H.reverse();
  let k = 0; for (let i = 1; i < 4; i++) if (H[i][0] + H[i][1] < H[k][0] + H[k][1]) k = i;
  H = H.slice(k).concat(H.slice(0, k));
  // 往內縮一點，避免邊緣露出桌面
  const cx = (H[0][0] + H[1][0] + H[2][0] + H[3][0]) / 4, cy = (H[0][1] + H[1][1] + H[2][1] + H[3][1]) / 4;
  const out = [];
  for (const [x, y] of H) {
    const dx = x - cx, dy = y - cy, l = Math.hypot(dx, dy) || 1;
    out.push(Math.min(1, Math.max(0, (x + 0.5 - dx / l * 1.2) / w)), Math.min(1, Math.max(0, (y + 0.5 - dy / l * 1.2) / h)));
  }
  return out;
}
function detectOn(src) {
  const c = scaledCanvas(src, 360);
  return detectQuad(ctxOf(c).getImageData(0, 0, c.width, c.height));
}

/* ---------- 透視校正（把斜的紙拉正） ---------- */
function quadMap(q) {

/* ---------- 去陰影、提亮紙張、彩色 / 灰階 / 黑白 ---------- */
function paperBackground(img) {

/* ---------- 單頁完整處理：裁切 → 濾鏡 → 旋轉 ---------- */
function render(p, src, cap, filter) {

  imgs.forEach((im, i) => {
    const land = im.w > im.h;
    let PW, PH;
    if (paper === "fit") { const L = 841.89; if (land) { PW = L; PH = L * im.h / im.w; } else { PH = L; PW = L * im.w / im.h; } }
    else { const [a, b] = paper === "letter" ? [612, 792] : [595.28, 841.89]; [PW, PH] = land ? [b, a] : [a, b]; }
    const s = Math.min(PW / im.w, PH / im.h), dw = im.w * s, dh = im.h * s;
    const pn = 3 + i * 3, cn = pn + 1, xn = pn + 2;
    offs[pn] = pos;
    push(`${pn} 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${f(PW)} ${f(PH)}] /Resources << /XObject << /Im0 ${xn} 0 R >> /ProcSet [/PDF /ImageB /ImageC] >> /Contents ${cn} 0 R >>\nendobj\n`);
    const cs = `q ${f(dw)} 0 0 ${f(dh)} ${f((PW - dw) / 2)} ${f((PH - dh) / 2)} cm /Im0 Do Q`;
    offs[cn] = pos; push(`${cn} 0 obj\n<< /Length ${cs.length} >>\nstream\n${cs}\nendstream\nendobj\n`);
    offs[xn] = pos;
    push(`${xn} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${im.w} /Height ${im.h} ${im.dict} /Length ${im.bytes.length} >>\nstream\n`);
    push(im.bytes); push("\nendstream\nendobj\n");
  });
  const xref = pos;
  let x = `xref\n0 ${total}\n0000000000 65535 f \n`;
  for (let k = 1; k < total; k++) x += String(offs[k]).padStart(10, "0") + " 00000 n \n";
  push(x); push(`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
  return new Blob(parts, { type: "application/pdf" });
}

/* ---------- 輸出面板 ---------- */
let pdfFile = null, pdfUrl = null;
function openSheet(id) { $("sheetBg").classList.add("on"); $(id).classList.add("on"); }
function closeSheets() { if (!$("exBusy").hidden) return; $("sheetBg").classList.remove("on"); document.querySelectorAll(".sheet").forEach(s => s.classList.remove("on")); }
$("sheetBg").onclick = closeSheets;
function segSet(id, v) { $(id).querySelectorAll("button").forEach(b => b.classList.toggle("act", b.dataset.v === v)); }
function colorNote() {
  const m = prefs.exColor, cnt = {}; pages.forEach(p => cnt[p.filter] = (cnt[p.filter] || 0) + 1);
  $("exColorNote").textContent = m === "page"
    ? "每頁照你在編輯畫面選的效果：" + Object.entries(cnt).map(([k, v]) => `${FILTER_NAME[k]} ${v} 頁`).join("、")
    : m === "bw" ? "全部轉成純黑白，最適合文字文件，檔案最小。"
    : m === "gray" ? "全部轉成灰階，保留鉛筆、印章的深淺。"
    : "全部用彩色（去陰影、提亮紙張）。";
}
function stamp() { const d = new Date(), z = n => String(n).padStart(2, "0"); return `${d.getFullYear()}${z(d.getMonth() + 1)}${z(d.getDate())}_${z(d.getHours())}${z(d.getMinutes())}`; }
$("exportBtn").onclick = () => {
  if (!pages.length) return;
  $("exForm").hidden = false; $("exBusy").hidden = true; $("exDone").hidden = true;
  $("exName").value = "掃描_" + stamp();
  segSet("exColor", prefs.exColor); segSet("exPaper", prefs.exPaper); segSet("exQual", prefs.exQual); colorNote();
  openSheet("exportSheet");
};
for (const [id, key] of [["exColor", "exColor"], ["exPaper", "exPaper"], ["exQual", "exQual"]])
  $(id).onclick = e => { const b = e.target.closest("button"); if (!b) return; prefs[key] = b.dataset.v; savePrefs(); segSet(id, b.dataset.v); colorNote(); };
$("exGo").onclick = async () => {
  const name = ($("exName").value.trim() || "掃描_" + stamp()).replace(/[\\/:*?"<>|]+/g, "_").replace(/\.pdf$/i, "") + ".pdf";
  $("exForm").hidden = true; $("exBusy").hidden = false;
  const cap = prefs.exQual === "h" ? 3000 : 2000, jq = prefs.exQual === "h" ? 0.88 : 0.72, list = pages.slice(), imgs = [];
  try {
    for (let i = 0; i < list.length; i++) {
      $("exStep").textContent = `處理第 ${i + 1} / ${list.length} 頁`;
      $("exBar").style.width = (i / list.length * 100) + "%";
      await tick();
      const p = list[i], mode = prefs.exColor === "page" ? p.filter : prefs.exColor;
      const img = await loadImg(p.blob), c = render(p, img, cap, mode);
      imgs.push(await encodeImage(c, mode, jq));
      c.width = c.height = 0;
    }
    $("exBar").style.width = "100%"; $("exStep").textContent = "組合檔案…"; await tick();
    const blob = buildPdf(imgs, prefs.exPaper);
    pdfFile = new File([blob], name, { type: "application/pdf" });
    if (pdfUrl) URL.revokeObjectURL(pdfUrl);
    pdfUrl = URL.createObjectURL(pdfFile);
    $("exFile").textContent = name;
    $("exInfo").textContent = `${list.length} 頁・${(blob.size / 1048576).toFixed(blob.size < 1048576 ? 2 : 1)} MB`;
    $("exShare").hidden = !(navigator.canShare && navigator.canShare({ files: [pdfFile] }));
    $("exBusy").hidden = true; $("exDone").hidden = false;
  } catch (err) {
    $("exBusy").hidden = true; $("exForm").hidden = false;
    toast("產生失敗：" + (err && err.message || err));
  }
};
$("exDl").onclick = () => { const a = document.createElement("a"); a.href = pdfUrl; a.download = pdfFile.name; document.body.appendChild(a); a.click(); a.remove(); };
$("exView").onclick = () => window.open(pdfUrl, "_blank");
$("exShare").onclick = async () => {
  try { await navigator.share({ files: [pdfFile], title: pdfFile.name }); }
  catch (e) { if (e && e.name !== "AbortError") $("exDl").onclick(); }
};

/* ---------- 更多選項 ---------- */
$("menuBtn").onclick = () => {
  $("menuSheet").querySelectorAll("button").forEach(b => b.disabled = !pages.length);
  openSheet("menuSheet");
};
$("menuSheet").onclick = async e => {
  const b = e.target.closest("button[data-act]"); if (!b) return;
  const act = b.dataset.act; closeSheets();
  if (act === "reverse") { pages.reverse(); saveOrder(); renderGrid(); toast("已反轉順序"); }
  if (act === "clear") {
    if (!confirm(`確定刪除全部 ${pages.length} 頁？`)) return;
    pages.forEach(p => p.url && URL.revokeObjectURL(p.url)); pages = [];
    await DB.clear(); saveOrder(); renderGrid();
  }
  if (act === "all-color" || act === "all-bw") {
    const f = act === "all-color" ? "color" : "bw"; prefs.filter = f; savePrefs();
    toast(`套用中…`);
    for (const p of pages) {
      if (p.filter === f) continue;
      p.filter = f; cardFor(p).classList.add("loading");
      try { await makeThumb(p, await loadImg(p.blob)); } catch {}
      save(p); renderGrid(); await tick();
    }
    toast(`全部改成${FILTER_NAME[f]}了`);
  }
};

/* ---------- 提示 ---------- */
let toastTimer = 0;
function toast(msg, actLabel, act) {
  $("toastMsg").textContent = msg;
  const b = $("toastAct"); b.hidden = !actLabel;
  if (actLabel) { b.textContent = actLabel; b.onclick = () => { $("toast").classList.remove("on"); act(); }; }
  $("toast").classList.add("on");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => $("toast").classList.remove("on"), actLabel ? 5000 : 2400);
}

/* ================= 啟動 ================= */
(async () => {
  try {
    const [all, order] = await Promise.all([DB.all(), DB.get("order")]);
    const byId = new Map(all.map(p => [p.id, p])), seen = new Set();
    for (const id of order || []) if (byId.has(id)) { pages.push(byId.get(id)); seen.add(id); }
    for (const p of all) if (!seen.has(p.id)) pages.push(p);
    for (const p of pages) if (p.thumb) p.url = URL.createObjectURL(p.thumb);
    renderGrid();
    for (const p of pages) if (!p.url) { try { await makeThumb(p, await loadImg(p.blob)); save(p); renderGrid(); } catch {} }
  } catch { renderGrid(); }
})();
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));

})();
</script>
</body>
